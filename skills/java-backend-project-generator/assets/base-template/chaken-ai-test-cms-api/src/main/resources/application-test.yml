server:
  port: 28080

spring:
  datasource:
    url: jdbc:h2:mem:cms_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration

chaken:
  web:
    cors:
      allowed-origins:
        - https://cms-test.example.com
