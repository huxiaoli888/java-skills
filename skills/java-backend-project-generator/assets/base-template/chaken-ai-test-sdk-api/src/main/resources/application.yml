server:
  port: 18081
  servlet:
    context-path: /chaken-ai-test-sdk-api

spring:
  application:
    name: chaken-ai-test-sdk-api
  profiles:
    active: dev

chaken:
  web:
    cors:
      enabled: true
      path-pattern: /**
      allowed-origins: []
      allowed-origin-patterns: []
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - authorization
        - accept-language
        - content-type
        - x-api-key
        - x-timestamp
        - x-reqid
        - x-sign
        - x-sign-alg
        - x-api-version
        - x-trace-id
        - x-udid
      exposed-headers:
        - x-trace-id
      allow-credentials: true
      max-age: 1800
  security:
    rate-limit:
      enabled: true
      default-permits: 300
      default-window: 1m
      identity-headers:
        - x-api-key
        - x-udid
      exclude-paths:
        - /actuator/health
      rules:
        - path-pattern: /api/v1/sdk/**
          permits: 300
          window: 1m
    sql-injection:
      enabled: true
      check-query-parameters: true
      check-form-parameters: false
      exclude-paths:
        - /api/v1/sdk/health
    file-upload:
      enabled: true
      max-bytes: 10485760
      allowed-content-types:
        - image/png
        - image/jpeg
        - application/pdf
      allowed-extensions:
        - png
        - jpg
        - jpeg
        - pdf
  sdk:
    security:
      signature-enabled: true
      replay-window: 5m
      auth-exclude-paths:
        - /api/v1/sdk/health
      udid-exclude-paths:
        - /api/v1/sdk/health

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
